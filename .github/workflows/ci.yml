# ═══════════════════════════════════════════════════════════════════════════════
# FasoMarket — CI (Intégration Continue)
# ═══════════════════════════════════════════════════════════════════════════════
# Déclenché sur :
#   - push sur main
#   - pull requests vers main
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'mobile/**'
      - '.gitignore'
      - 'nginx/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'mobile/**'
      - '.gitignore'
      - 'nginx/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BACKEND_DIR: backend

jobs:
  # ─── Job 1 : Lint & TypeScript ─────────────────────────────────────────
  lint:
    name: 🔍 Lint & TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (monorepo racine)
        run: npm ci
        working-directory: .

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://fasomarket:fasomarket_secret@localhost:5432/fasomarket

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc --noEmit --pretty

  # ─── Job 2 : Tests unitaires (mock DB, pas besoin de services) ─────────
  test:
    name: 🧪 Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (monorepo racine)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql://fasomarket:fasomarket_secret@localhost:5432/fasomarket

      - name: Run unit tests (MockPrismaService)
        run: npm test
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.BACKEND_DIR }}/coverage/
          retention-days: 7

  # ─── Job 3 : Build NestJS + Docker ────────────────────────────────────
  build:
    name: 📦 Build & Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (monorepo racine)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql://fasomarket:fasomarket_secret@localhost:5432/fasomarket

      - name: Build NestJS
        run: npm run build
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: ${{ env.BACKEND_DIR }}/dist/
          retention-days: 3

      # ─── Docker : build + push (sur push main uniquement) ─────────────
      - name: Set up QEMU
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
