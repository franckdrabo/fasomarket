# ─── Bazario — Docker Compose Production ──────────────────────────────────────
# Usage:
#   1. Créer le fichier .env.prod avec les variables d'environnement
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod exec backend npx prisma migrate deploy
#
# Vérifier les logs:
#   docker compose -f docker-compose.prod.yml logs -f backend
# ───────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bazario-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-bazario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      POSTGRES_DB: ${DB_NAME:-bazario}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bazario}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Ne pas exposer le port 5432 en prod — accès uniquement via le réseau Docker
    networks:
      - bazario-internal

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bazario-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bazario-internal

  # ─── Backend NestJS ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bazario-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${DB_USER:-bazario}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-bazario}?schema=public&connection_limit=20&pool_timeout=10"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requis}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requis}
      API_SECRET: ${API_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      REQUIRE_WEBHOOK_SIGNATURE: ${REQUIRE_WEBHOOK_SIGNATURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://api.bazario.com}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_API_URL: ${CINETPAY_API_URL:-}
      CINETPAY_NOTIFY_URL: ${CINETPAY_NOTIFY_URL:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      AT_API_URL: ${AT_API_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?SMTP_USER requis (email d'envoi OTP)}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS requis (App Password Gmail)}
      SMTP_FROM: ${SMTP_FROM:-Bazario}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-credentials.json
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    networks:
      - bazario-internal
      - bazario-public

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bazario-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_data:/var/www/certbot
    networks:
      - bazario-public

volumes:
  postgres_data:
    name: bazario_postgres_data
  redis_data:
    name: bazario_redis_data
  nginx_data:
    name: bazario_nginx_data

networks:
  bazario-internal:
    driver: bridge
  bazario-public:
    driver: bridge
