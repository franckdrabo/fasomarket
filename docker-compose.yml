version: '3.8'

services:
  # ─── Base de données PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fasomarket-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-fasomarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fasomarket_secret}
      POSTGRES_DB: ${DB_NAME:-fasomarket}
    # Pas de port host — accès interne Docker uniquement via "postgres:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fasomarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fasomarket-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Pas de port host — accès interne Docker uniquement via "redis:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend NestJS ──────────────────────────────────────────────────────
  backend:
    build:
      # Contexte à la racine pour accéder au package-lock.json du workspace
      context: .
      dockerfile: backend/Dockerfile
    container_name: fasomarket-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: "postgresql://${DB_USER:-fasomarket}:${DB_PASSWORD:-fasomarket_secret}@postgres:5432/${DB_NAME:-fasomarket}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Clé AES-256-GCM pour chiffrer les PII (email, refresh tokens) — obligatoire en prod
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Secret HMAC de l'anti-replay (si réactivé) — partagé avec les clients
      API_SECRET: ${API_SECRET:-}
      # Secret HMAC des webhooks Mobile Money (signature des callbacks)
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Exiger X-Signature sur les webhooks (CinetPay v1 ne signe pas → false par défaut)
      REQUIRE_WEBHOOK_SIGNATURE: ${REQUIRE_WEBHOOK_SIGNATURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://api.fasomarket.com}
      ORANGE_MONEY_API_KEY: ${ORANGE_MONEY_API_KEY:-}
      MOOV_MONEY_API_KEY: ${MOOV_MONEY_API_KEY:-}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      # CinetPay — agrégateur Mobile Money (Orange, Moov, Wave)
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_API_URL: ${CINETPAY_API_URL:-}
      CINETPAY_NOTIFY_URL: ${CINETPAY_NOTIFY_URL:-}
      # FedaPay (alternative KYC plus souple)
      FEDAPAY_PUBLIC_KEY: ${FEDAPAY_PUBLIC_KEY:-}
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      FEDAPAY_ENV: ${FEDAPAY_ENV:-test}
      FEDAPAY_CALLBACK_URL: ${FEDAPAY_CALLBACK_URL:-}
      # Africastalking — envoi des codes OTP par SMS
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      AT_API_URL: ${AT_API_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Chemin du fichier de credentials Firebase dans le conteneur
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/firebase-credentials.json}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Monter le fichier de credentials Firebase (créer firebase-credentials.json à la racine)
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── (Optionnel) Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fasomarket-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Pour le challenge ACME Let's Encrypt (renouvellement automatique)
      - ./nginx/certbot_data:/var/www/certbot
    profiles:
      - with-proxy

volumes:
  postgres_data:
    name: fasomarket_postgres_data
  redis_data:
    name: fasomarket_redis_data
