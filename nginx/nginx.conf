# ─── Bazario — Nginx Reverse Proxy Configuration ────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ─── Général ───────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # ─── Logs ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ─── Rate Limiting ──────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ─── Server HTTP (redirection vers HTTPS) ──────────────────────────────
    server {
        listen 80;
        server_name api.bazario.com;
        return 301 https://$server_name$request_uri;
    }

    # ─── Server HTTPS ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.bazario.com;

        # SSL — Remplacer par vos certificats Let's Encrypt
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ─── Root health check ─────────────────────────────────────────────
        location /api/v1/health {
            proxy_pass http://backend:3000/api/v1/health;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── API NestJS ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    120s;
        }

        # ─── WebSocket Socket.IO ───────────────────────────────────────────
        location /chat {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;  # 24h pour les WebSockets
            proxy_send_timeout 86400s;
        }

        # ─── Uploads ────────────────────────────────────────────────────────
        client_max_body_size 20M;

        # ─── Sécurité ──────────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
