# ─── FasoMarket — Nginx Reverse Proxy Configuration ────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ─── Général ───────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # ─── Logs ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ─── Rate Limiting ──────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # DNS Docker intégré — permet à nginx de DÉMARRER même si le backend
    # est temporairement indisponible (résolution dynamique par requête).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── Server HTTP (redirection vers HTTPS + ACME challenge) ────────────
    server {
        listen 80;
        server_name api.fasomarket.com;

        # Let's Encrypt ACME challenge (nécessaire pour le renouvellement)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            allow all;
        }

        # Tout le reste → redirection HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ─── Server HTTPS ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.fasomarket.com;

        # Upstream résolu dynamiquement via le resolver Docker (voir plus haut)
        set $backend_upstream http://backend:3000;

        # SSL — Certificats Let's Encrypt (générés par scripts/setup-ssl.sh)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_dhparam         /etc/nginx/ssl/dhparam.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        # ─── Root health check ─────────────────────────────────────────────
        location /api/v1/health {
            proxy_pass $backend_upstream;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── API NestJS ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    120s;
        }

        # ─── WebSocket Socket.IO ───────────────────────────────────────────
        location /chat {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;  # 24h pour les WebSockets
            proxy_send_timeout 86400s;
        }

        # ─── Uploads ────────────────────────────────────────────────────────
        client_max_body_size 20M;

        # ─── Sécurité ──────────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
